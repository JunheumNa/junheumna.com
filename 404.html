<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0; url=/" />
  <title>Redirecting…</title>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/variable/pretendardvariable.css" />
  <style>
    body { background-color: black; }
    .loading {
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height:100vh; 
      color: white; 
      font-size: 18px; 
      font-family:
      "Pretendard Variable", Pretendard, "Segoe UI Symbol", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      font-weight: 250;
    }
  </style>
</head>
<body>
  <div class="loading">
    <p>Loading...</p>
  </div>

  <script>
    (function () {
      var path = window.location.pathname || "";
      var m = path.match(/\/gallery\/([^/]+)$/);
      var dest = "/";

      if (m && m[1]) {
        var pid = m[1];
        dest = "/?photoId=" + encodeURIComponent(pid);
      } else {
        dest = "/";
      }

      window.location.replace(dest);
    })();
  </script>
</body>
</html>
